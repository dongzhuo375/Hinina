# Tauri 2 Ubuntu 构建依赖的单一事实来源。
# 此前这份 apt 清单在 ci.yml（rust-lint / rust-test）与 integration.yml
# （build / stress-repeat / rust-coverage）共 5 份拷贝，存在漂移风险（评审二轮）。
# 调用方自行守卫 `if: runner.os == 'Linux'`（composite action 内拿不到稳定的
# 平台语境；纯 ubuntu job 可不守卫）。
name: 'Install Tauri 2 system dependencies'
description: 'apt 安装 Tauri 2 / QuickJS 构建所需系统依赖（WebKitGTK、libxdo、libssl 等）'
runs:
  using: 'composite'
  steps:
    - name: Install Tauri 2 system dependencies
      shell: bash
      # 三层防护：
      # ① apt.conf.d drop-in（Retries/连接超时）—— update 与 install 都继承；
      # ② 已装快路径——runner 镜像若已带全部依赖则跳过网络（镜像挂起时最有效）；
      # ③ 每命令硬墙钟 + 最多 3 次整体重试——镜像慢速挂起实测可吃掉 15 分钟以上
      #    （PR/main 两处实测：install 命中 timeout 900 的 rc=124），重试给它换一次机会，
      #    同时把最坏耗时限制在 ~22 分钟以内（远低于 45 分钟 job 上限）。
      run: |
        echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/99-hinina-apt >/dev/null
        echo 'Acquire::http::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/99-hinina-apt >/dev/null
        echo 'Acquire::https::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/99-hinina-apt >/dev/null

        packages="libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev"

        missing=0
        for pkg in $packages; do
          if ! dpkg-query -W -f='${Status}' "$pkg" 2>/dev/null | grep -q "install ok installed"; then
            missing=1
            break
          fi
        done
        if [ "$missing" = "0" ]; then
          echo "All Tauri 2 system dependencies already installed; skipping apt."
          exit 0
        fi

        for attempt in 1 2 3; do
          echo "::group::apt install attempt $attempt / 3"
          if sudo timeout 150 apt-get update && \
             sudo timeout 300 apt-get install -y $packages; then
            echo "::endgroup::"
            exit 0
          fi
          echo "::endgroup::"
          echo "::warning::apt attempt $attempt failed (mirror stall or timeout); cleaning and retrying"
          sudo apt-get clean || true
        done
        echo "::error::apt install failed after 3 attempts"
        exit 1
