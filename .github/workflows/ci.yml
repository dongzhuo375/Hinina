# M1 最小 PR CI（doc/cicd/m1-pr-gate.md）
# 阻塞链：frontend + rust-lint + rust-test → ci-required（分支保护必需检查）。
# rust-lint 于 lint 门禁清理 PR（doc/cicd/lint-gate-cleanup.md）后升为必需。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml 的 test job 通过 workflow_call 复用本门禁（发布同样不跳过检查）。
  workflow_call:

permissions:
  contents: read

# 组名含 event_name：被 workflow_call 调用时 github.workflow 解析为调用方的名字
# （orgs/community#30708 社区实证；官方文档未记载该语义）。若组模板与调用方相同
# （workflow-ref），被调用方的并发求值会作为新请求进入调用方运行所在的组，并按本文件
# 的 cancel-in-progress 取消它（对 tag ref 恒为 true）——release.yml 的发布运行会被
# 自己的 test 子调用取消。加 event_name 后 callee 组为 <Caller>-push-refs/tags/…，
# 与调用方自身组（无 event 段）恒不同。注意：callee 的 event_name 是调用方的原始
# 触发事件（tag 推送 = push），不是 workflow_call。副作用：main 的 push 与
# workflow_dispatch 由共享一组变为可并行。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # packageManager 固定 npm 11.18.0；corepack enable npm 安装 npm shim，使其按该
      # 字段解析（裸 corepack enable 默认不含 npm shim，实测见 m3-integration §九）
      - name: Enable corepack npm shim (pin npm via packageManager)
        run: corepack enable npm
      - name: Verify node version matches .nvmrc
        run: test "$(node --version)" = "v$(cat .nvmrc)"
      - run: npm ci
      # tsconfig.node.json 的 include 含 vite.config.ts / playwright.config.ts / e2e/**/*.ts：
      # 这一步同时门禁 E2E 与配置文件的类型（评审四轮的「e2e 无门禁」在此已覆盖）
      - name: Type-check config and e2e sources
        run: npx tsc -p tsconfig.node.json --noEmit
      - run: npm run plugin:sdk:check
      # vitest run --coverage：同一套测试 + V8 覆盖率报告（基线只报告不卡线，M2 起）
      - run: npm run test:coverage
      - run: npm run build
      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 14

  rust-lint:
    name: rust-lint
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Tauri 2 系统依赖 + QuickJS C 编译前提（单一事实来源：.github/actions/tauri-system-deps）
      - uses: ./.github/actions/tauri-system-deps
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # 仓库根无 Cargo.toml：不指定则探测失败、src-tauri/target 永不缓存（评审六轮）
          workspaces: "src-tauri -> target"
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      # --locked 同时充当锁文件校验：Cargo.lock 与 Cargo.toml 不同步时直接失败
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

  rust-test:
    name: rust-test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/tauri-system-deps
        if: runner.os == 'Linux'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "src-tauri -> target"
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --all-targets
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked --doc

  # 汇总 job：作为分支保护的唯一必需检查名（稳定名，改名须同步分支保护）。
  ci-required:
    name: ci-required
    needs: [frontend, rust-lint, rust-test]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Fail if any required job failed or was cancelled
        run: |
          echo "frontend=${{ needs.frontend.result }} rust-lint=${{ needs.rust-lint.result }} rust-test=${{ needs.rust-test.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "::error::a required job failed or was cancelled"
            exit 1
          fi
