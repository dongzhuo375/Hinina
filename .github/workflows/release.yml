# M4：标签触发的 Windows 草稿发布（doc/cicd/m4-release.md）。
# job 名是稳定名（doc/cicd/m0-baseline.md §六），改名须同步该表与 RELEASE.md。
# OS 签名（M5）与 updater（M6）不在本工作流范围内；产物为未签名草稿，人工验收后手动公开。
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout tag (full history for main containment check)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require tag to point into main history
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Version gate (five files, tag match, CHANGELOG section)
        run: node scripts/check-release-versions.mjs --tag "$GITHUB_REF_NAME" --changelog

  # 复用完整必需 CI：发布时同样不跳过任何检查（ci.yml 需保留 workflow_call 触发器）。
  test:
    name: test
    needs: validate
    uses: ./.github/workflows/ci.yml

  build-windows:
    name: build-windows
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Enable corepack npm shim (pin npm via packageManager)
        run: corepack enable npm
        shell: bash
      - name: Verify node version matches .nvmrc
        run: test "$(node --version)" = "v$(cat .nvmrc)"
        shell: bash
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
      - name: Build frontend (npm ci + vue-tsc + vite build)
        run: |
          npm ci
          npm run build
      - name: Build desktop app (tauri build, no bundle)
        # 两类参数必须放对位置：--no-bundle 是 **tauri 的旗标**（放在内层 `--` 之前；
        # 它在内层之后会被透传给 cargo，cargo 不认识该参数、构建必失败），--locked
        # 是 **cargo 的旗标**（经 tauri 的 [ARGS]... 透传，必须在内层 `--` 之后）。
        # 另外 `--` 在 npm 转发链上会被逐层剥除：`npm run tauri build -- --locked` →
        # npm 剥掉 `--` → tauri 自己拒收（exit 2/1，永远到不了 cargo）；
        # `npm run tauri -- build -- ...` 在 bash 下内层 `--` 存活、参数各归其位
        # （本机实证）；但 runner 默认 pwsh 会把两个 `--` 都吞掉而失败（首次试跑
        # tag 实证）。故显式钉 shell: bash。失败模式是显式的，不会静默出包。
        # 发布主线只出裸 exe（target/release/hinina.exe），不打 NSIS 安装包。
        # NSIS 线路保留——tauri.conf.json 的 bundle.targets 仍为 ["nsis"]，
        # 移除 --no-bundle（内层 `--` 之前不传任何 tauri 旗标）即恢复安装包产物。
        shell: bash
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Collect build metadata
        shell: bash
        run: |
          node -e "
            const { execSync } = require('node:child_process');
            const { writeFileSync } = require('node:fs');
            const v = (c) => execSync(c).toString().trim();
            writeFileSync('build-metadata.json', JSON.stringify({
              tag: process.env.GITHUB_REF_NAME,
              commit: process.env.GITHUB_SHA,
              built_at: new Date().toISOString(),
              node: v('node --version'),
              npm: v('npm --version'),
              rustc: v('rustc --version'),
              cargo: v('cargo --version'),
              target: 'x86_64-pc-windows-msvc',
              bundle: 'none',
              signed: false,
            }, null, 2) + '\n');
          "
      - name: Stage release files
        # 裸 exe 在 target/release 根上（无 bundle 深路径），但版本号从 tauri.conf.json
        # 读取拼进产物名（Hinina_<版本>_x64.exe，与 verify-artifact 的断言同源）；
        # 保留单一 staging 目录上传，artifact 根稳定、下载侧断言不变。
        shell: bash
        run: |
          version="$(node scripts/check-release-versions.mjs --print-version)"
          mkdir -p release-staging
          cp src-tauri/target/release/hinina.exe "release-staging/Hinina_${version}_x64.exe"
          cp build-metadata.json release-staging/
          ls -l release-staging/
      - name: Upload executable artifact (unsigned)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-unsigned
          path: release-staging/*
          # 30 天：draft-release 可能在 release environment 等待人工审批数日，
          # 产物必须活过审批窗口（超期需整跑 gh run rerun <id>，见 RELEASE.md §四）。
          retention-days: 30
          if-no-files-found: error

  verify-artifact:
    name: verify-artifact
    needs: build-windows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Re-run version gate on the tagged tree
        run: node scripts/check-release-versions.mjs --tag "$GITHUB_REF_NAME" --changelog
      - name: Download executable artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-windows-unsigned
          path: artifact
      - name: Verify executable name and file type
        run: |
          version="$(node scripts/check-release-versions.mjs --print-version)"
          expected="Hinina_${version}_x64.exe"
          set -- artifact/*.exe
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "::error::expected exactly one executable file, found $#"
            exit 1
          fi
          base="$(basename "$1")"
          if [ "$base" != "$expected" ]; then
            echo "::error::unexpected executable name: $base (expected $expected)"
            exit 1
          fi
          if ! file "$1" | grep -qi "ms windows"; then
            echo "::error::$base is not a Windows PE file"
            exit 1
          fi
      - name: Compute SHA-256 checksums
        run: |
          version="$(node scripts/check-release-versions.mjs --print-version)"
          cd artifact
          sha256sum "Hinina_${version}_x64.exe" > SHA256SUMS.txt
      - name: Upload verified artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows-verified
          path: artifact/*
          retention-days: 30
          if-no-files-found: error

  # 任一前置失败则本 job 跳过（默认语义），不产生半成品草稿。
  draft-release:
    name: draft-release
    needs: [test, verify-artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download verified artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-windows-verified
          path: artifact
      - name: Build release notes from CHANGELOG
        run: node scripts/check-release-versions.mjs --extract-notes > notes.md
      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- artifact/Hinina_*_x64.exe artifact/SHA256SUMS.txt artifact/build-metadata.json
          title="Hinina $GITHUB_REF_NAME"
          # 先探状态：只有「确实不存在」才 create。把 stderr 一并吞掉会把认证/网络/
          # 限流故障误判为「无 release」，进而走 create 报出误导性错误，故保留 stderr
          # 并按输出区分。
          if is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft' 2>view.err)"; then
            if [ "$is_draft" != "true" ]; then
              echo "::error::release $GITHUB_REF_NAME is already published; published releases are immutable - deliver fixes as a new version"
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" "$@" --clobber
            gh release edit "$GITHUB_REF_NAME" --draft --title "$title" --notes-file notes.md
          elif grep -qiE 'release not found|HTTP 404|Not Found' view.err; then
            gh release create "$GITHUB_REF_NAME" "$@" --draft --title "$title" --notes-file notes.md
          else
            echo "::error::failed to inspect release $GITHUB_REF_NAME (not a not-found error):"
            cat view.err
            exit 1
          fi
          gh release view "$GITHUB_REF_NAME" --json isDraft,assets --jq '"draft=\(.isDraft) assets=\(.assets | length)"'
