[package]
name = "hinina"
version = "0.2.4"
edition = "2021"
authors = ["dongzhuo375"]
description = "Hinina：面向 ACM/ICPC 与 XCPC 场景的 OJ 桌面竞赛客户端"

[dependencies]
tauri = { version = "2", features = [] }
# 目录选择器（设置页「数据目录」）。
#
# 注：本项目**不注册** tauri-plugin-fs / -http —— 所有 I/O 都走 Rust
# （网络经 infra/http.rs 的 reqwest，文件经 infra/storage.rs），前端也从不 import
# `@tauri-apps/plugin-*`。此前这两个依赖与对应的 capability 声明一直挂着但从未生效，
# 还会让 Tauri CLI 报「NPM 包与 Rust crate 版本不匹配」，已移除。
# `tauri-plugin-fs` 仍会作为 dialog 的传递依赖出现在依赖树里（dialog 复用了它的
# `FilePath` 类型），那是正常的。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "cookies"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# rquickjs 在构建时用 C 编译器编译内置 QuickJS（MSVC/gcc/clang），构建前提见 README。
# 新增的直接依赖均服务于插件宿主，逐项用途见 PR #41 描述与 doc/modules/src-tauri/plugin/README.md。
rquickjs = { version = "0.14", default-features = false, features = ["std", "futures"] }
atomicwrites = "0.4"
fs4 = "1.1"
governor = "0.10"
semver = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
ipnet = "2"
ip_network = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-dialog = "2.7.3"
# 单实例约束：同一次只允许运行一个应用实例；重复启动时新进程退出并聚焦
# 已有窗口。纯 Rust 侧插件 —— 无 JS API、无 npm 包、无 capability 声明
# （区别于 dialog 的「npm 包与 Rust crate 对齐」要求，本插件无 npm 侧）。
# 官方要求它**第一个注册**（检测须早于其它插件初始化，见 main.rs Builder
# 链首位）。刻意停在 2.4.5：2.5.x 起要求 tauri ^2.12，会把 tauri/tao/wry
# 整个运行栈连带升级（42 包），等下次 tauri 升级时一起抬。3.0.0-alpha 是
# Tauri v3 线，不适用。
tauri-plugin-single-instance = "2.4.5"

# `infra::console` 的 `--console` 启动参数：release GUI 构建重新附加调试控制台。
# 只在 Windows 目标编译；API 用途与签名取证自 windows-sys 0.59 源码
# （SetStdHandle/STD_* 在 Win32::System::Console，CreateFileW/GENERIC_* 分布见模块内 use）。
# `infra::startup_dialog` 的 MessageBoxW 在 Win32::UI::WindowsAndMessaging。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "hinina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
