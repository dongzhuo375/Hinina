[package]
name = "hinina"
version = "0.1.2"
edition = "2021"
authors = ["dongzhuo375"]
description = "Hinina：面向 ACM/ICPC 与 XCPC 场景的 OJ 桌面竞赛客户端"

[dependencies]
tauri = { version = "2", features = [] }
# 目录选择器（设置页「数据目录」）。
#
# 注：本项目**不注册** tauri-plugin-fs / -http —— 所有 I/O 都走 Rust
# （网络经 infra/http.rs 的 reqwest，文件经 infra/storage.rs），前端也从不 import
# `@tauri-apps/plugin-*`。此前这两个依赖与对应的 capability 声明一直挂着但从未生效，
# 还会让 Tauri CLI 报「NPM 包与 Rust crate 版本不匹配」，已移除。
# `tauri-plugin-fs` 仍会作为 dialog 的传递依赖出现在依赖树里（dialog 复用了它的
# `FilePath` 类型），那是正常的。
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "cookies"] }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
# rquickjs 在构建时用 C 编译器编译内置 QuickJS（MSVC/gcc/clang），构建前提见 README。
# 新增的直接依赖均服务于插件宿主，逐项用途见 PR #41 描述与 doc/modules/src-tauri/plugin/README.md。
rquickjs = { version = "0.14", default-features = false, features = ["std", "futures"] }
atomicwrites = "0.4"
fs4 = "1.1"
governor = "0.10"
semver = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
ipnet = "2"
ip_network = "0.4"
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-dialog = "2.7.3"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[lib]
name = "hinina_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
